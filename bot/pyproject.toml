[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "afisha-telegram-bot"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["aiogram>=3.13,<4", "aiohttp-socks>=0.9,<1", "httpx>=0.27,<1", "python-dotenv>=1,<2"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2"]

[tool.setuptools.packages.find]
include = ["app*"]
namespaces = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]
testpaths = ["tests"]
