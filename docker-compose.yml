services:
  db:
    image: pgvector/pgvector:pg16
    container_name: bash_afisha_db
    environment:
      POSTGRES_DB: afisha
      POSTGRES_USER: afisha
      POSTGRES_PASSWORD: afisha_password
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U afisha -d afisha"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: bash_afisha_backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://afisha:afisha_password@db:5432/afisha
      CHECKPOINT_DB_URI: postgresql://afisha:afisha_password@db:5432/afisha
      LLM_BASE_URL: ${LLM_BASE_URL:-https://openrouter.ai/api/v1}
      LLM_API_KEY: ${LLM_API_KEY:-mock-api-key}
      LLM_MODEL_NAME: ${LLM_MODEL_NAME:-google/gemma-4-31b-it:free}
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-https://openrouter.ai/api/v1}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      EMBEDDING_MODEL_NAME: ${EMBEDDING_MODEL_NAME:-nvidia/nemotron-3.5-embed-8b:free}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-1536}
      LLM_TIMEOUT_SEC: "6.0"
      MAX_AGENT_STEPS: "5"
      MAX_DAILY_USER_BUDGET_RUB: "25.0"
      MAX_DIALOG_COST_RUB: "5.0"
      ADMIN_API_TOKEN: ${ADMIN_API_TOKEN:-local-demo-only-change-me}
      LANGGRAPH_STRICT_MSGPACK: "true"
    command: ["sh", "-c", "alembic upgrade head && exec uvicorn app.main:app --host 0.0.0.0 --port 8000"]
    ports:
      - "127.0.0.1:8000:8000"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_DATA_MODE: api
    container_name: bash_afisha_frontend
    environment:
      BACKEND_URL: http://backend:8000
    depends_on:
      - backend
    ports:
      - "3000:3000"
    restart: unless-stopped

volumes:
  pgdata:
